[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "configgen"
version = "0.1.0"
description = "A generic, plug-and-play desktop tool for generating text configurations from a guided form and Jinja templates."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "ConfigGen Contributors" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "pydantic>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
]
dev = [
    "PySide6>=6.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "black>=26.5.1",
    "pyinstaller>=6.0",
]

[project.scripts]
configgen = "configgen.cli:main"
configgen-gui = "configgen.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/configgen"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
