name: "Test"
id: device_onboarding
version: 1
status: published
description: "DB-backed example: region is a dropdown and device_name autocompletes from a SQLite database via queries.yaml. No prepare hook — the database only supplies field options, Tier 1 does the rest."
tags: ["example", "db-backed"]
identity_field: device_name
comment_prefix: "#"
template: Test.j2
fields:
  - key: device_name
    label: "Device name"
    type: lookup
    section: "Identity"
    required: true
    from_db: {query: device_names}
    help: "Autocompletes from the device inventory; free text is still accepted."

  - key: asset_tag
    label: "Asset tag"
    type: string
    section: "Identity"
    required: true
    pattern: '^[A-Z]{2}-\d{4,8}$'
    example: "AT-10234"

  - key: notes
    label: "Notes"
    type: text
    section: "Notes"
    required: false
