name: Deploy landing page to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "landing-page/**"
      - "CNAME"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The repo's CNAME (custom domain: configgen.com) lives at the repo
      # root, but with the "GitHub Actions" Pages source only whatever's
      # uploaded below actually gets published - carry it into the
      # deployed folder so the custom domain survives the switch from
      # branch-based deployment.
      - name: Include CNAME in the deployed folder
        run: cp CNAME landing-page/CNAME

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload landing-page as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing-page

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
