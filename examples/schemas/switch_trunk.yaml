name: "Switch Trunk Config"
id: switch_trunk
version: 1
status: published
description: "Tier 2 example with a multi-row lookup: the hook pulls every VLAN on the chosen switch and renders an interface block per VLAN."
tags: ["example", "hook", "db-backed"]
identity_field: switch_name
hook: switch_trunk
comment_prefix: "!"
template: switch_trunk.j2
fields:
  - key: switch_name
    label: "Switch"
    type: lookup
    section: "Identity"
    required: true
    from_db: {query: switch_names}
    help: "Choose a switch already in inventory."

  - key: uplink_port
    label: "Uplink port"
    type: string
    section: "Uplink"
    required: true
    pattern: '^[A-Za-z]+\d+/\d+$'
    example: "Gi1/0"

  - key: description
    label: "Trunk description"
    type: string
    section: "Uplink"
    required: false
    default: "uplink trunk"